name: Gateway API Conformance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
    paths:
      - "cmd/**"
      - "pkg/**"
      - "helm/**"
      - "test/conformance/**"
      - "go.mod"
      - "go.sum"

permissions: read-all

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # one CI environment: the run tunnel and the DNS records are named by
    # RUN_ID, two runs at once would remove each other's records
    concurrency:
      group: gateway-api-conformance-ci
      cancel-in-progress: false
    env:
      RUN_ID: ci
      ENV_FILE: .env.e2e
      MINIKUBE_CPUS: "4"
      MINIKUBE_MEMORY: 8g
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: './go.mod'

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Install minikube
        run: |
          curl -fsSL -o /tmp/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install /tmp/minikube /usr/local/bin/minikube

      - name: Create .env.e2e file
        run: |
          cat > .env.e2e <<EOF
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_NAME=${{ secrets.CLOUDFLARE_TUNNEL_NAME }}
          E2E_BASE_DOMAIN=${{ secrets.E2E_BASE_DOMAIN }}
          EOF

      - name: Start cluster and deploy
        run: make conformance-up

      - name: Run conformance
        run: make conformance

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: test/conformance/artifacts/report.yaml
          if-no-files-found: ignore
          retention-days: 30

      - name: Tear down
        if: always()
        run: make conformance-down

      - name: Remove Cloudflare leftovers
        if: always()
        run: make conformance-clean
