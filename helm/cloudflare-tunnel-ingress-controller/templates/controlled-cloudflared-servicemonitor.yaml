{{- if .Values.serviceMonitor.create }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cloudflare-tunnel-ingress-controller.fullname" . }}-controlled-cloudflared
  labels:
    {{- include "cloudflare-tunnel-ingress-controller.labels" . | nindent 4 }}
    {{- if .Values.serviceMonitor.labels }}
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.serviceMonitor.cloudflared.jobLabel }}
  jobLabel: {{ .Values.serviceMonitor.cloudflared.jobLabel }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: controlled-cloudflared
      {{- include "cloudflare-tunnel-ingress-controller.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      scheme: {{ .Values.serviceMonitor.cloudflared.scheme }}
      {{- if .Values.serviceMonitor.interval }}
      interval: {{ .Values.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- if .Values.serviceMonitor.cloudflared.honorLabels }}
      honorLabels: {{ .Values.serviceMonitor.cloudflared.honorLabels }}
      {{- end }}
      {{- if .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings: {{ .Values.serviceMonitor.metricRelabelings }}
      {{- end }}
      {{- if .Values.serviceMonitor.relabelings }}
      relabelings: {{ .Values.serviceMonitor.relabelings }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
